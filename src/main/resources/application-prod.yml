# ── Production profile: R2 storage, minimal logging ──────────────

server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        type:
          preferred_uuid_jdbc_type: BINARY

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  storage:
    type: r2

logging:
  level:
    root: WARN
    com.hungphu: INFO