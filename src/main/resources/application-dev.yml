# ── Dev profile: local storage, verbose logging ──────────────────

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hungphu_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: root
    password: 123456

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    properties:
      mail:
        debug: true

app:
  storage:
    type: local
    local:
      upload-dir: ./uploads
      public-url: http://localhost:8080/uploads
  email:
    enabled: false

logging:
  level:
    root: INFO
    com.hungphu.crm: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG